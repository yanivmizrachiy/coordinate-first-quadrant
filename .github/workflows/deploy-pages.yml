# Manual-only deploy to GitHub Pages. This NEVER runs automatically — it fires
# solely when a maintainer triggers it from the Actions tab (workflow_dispatch),
# so nothing is published without an explicit human action.
name: Deploy to GitHub Pages (manual)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # The OLD address serves the booklet and nothing else — Yaniv: „הקישור
      # הקודם כלל רק את החוברת, בלי העיצובים של האתר". The full landing site
      # lives on the NEW link (Vercel), which builds without this flag.
      - run: npm run build
        env:
          VITE_SITE: booklet
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
