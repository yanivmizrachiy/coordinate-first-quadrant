name: Deploy to GitHub Pages

# The teacher-facing URL must never change. Every verified main update publishes
# to the same GitHub Pages address; workflow_dispatch remains for recovery/manual reruns.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Unit and content tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Measured checks (A4 layout, sizes, Hebrew direction, mobile)
        run: npm run test:visual
      - name: Keep the failure trace
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Build
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
