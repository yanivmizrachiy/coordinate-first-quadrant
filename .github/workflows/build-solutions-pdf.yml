# Public solutions are distributed as PDF only.
name: Build print-only solutions PDF

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/data/solutions/**'
      - 'src/data/workbook/**'
      - 'src/views/solutions.ts'
      - 'src/styles/solutions.css'
      - 'scripts/build-solutions-pdf.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'public/solutions/index.html'
      - 'tests/solutions.test.ts'
      - 'USER_MEMORY.md'
      - '.github/workflows/build-solutions-pdf.yml'
  push:
    branches: [main]
    paths:
      - 'src/data/solutions/**'
      - 'src/data/workbook/**'
      - 'src/views/solutions.ts'
      - 'src/styles/solutions.css'
      - 'scripts/build-solutions-pdf.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'public/solutions/index.html'
      - 'tests/solutions.test.ts'
      - 'USER_MEMORY.md'
      - '.github/workflows/build-solutions-pdf.yml'

permissions:
  contents: write

concurrency:
  group: solutions-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-solutions-pdf:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify solutions rules
        run: npx vitest run tests/solutions.test.ts

      - name: Build site
        run: npm run build

      - name: Build print-only PDF
        run: npm run solutions:pdf

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: solutions-pdf
          path: public/solutions.pdf
          if-no-files-found: error
          retention-days: 7

      - name: Bootstrap verified PDF into main
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/publish-solutions-pdf-now'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          base64 -w0 public/solutions.pdf > /tmp/solutions.b64
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/public/solutions.pdf?ref=main" --jq .sha 2>/dev/null || true)"
          if [ -n "$existing_sha" ]; then
            jq -n --rawfile content /tmp/solutions.b64 --arg sha "$existing_sha" '{message:"build: publish verified print-only solutions PDF",content:$content,branch:"main",sha:$sha}' > /tmp/payload.json
          else
            jq -n --rawfile content /tmp/solutions.b64 '{message:"build: publish verified print-only solutions PDF",content:$content,branch:"main"}' > /tmp/payload.json
          fi
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/public/solutions.pdf" --input /tmp/payload.json

      - name: Commit generated PDF
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if git diff --quiet -- public/solutions.pdf; then
            echo 'solutions.pdf is already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/solutions.pdf
          git commit -m 'build: update print-only solutions PDF'
          git push origin HEAD:main
